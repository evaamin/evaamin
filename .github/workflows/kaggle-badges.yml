name: Update Kaggle badges

on:
  schedule:
    # Runs once a day at 09:00 UTC. Adjust as you like.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Debug fetch
        run: |
          python scripts/fetch_and_render.py \
            --username evanka1 \
            --out kaggle-badges.svg \
            --theme dark \
            --debug

      - name: Upload debug output
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-debug-blobs
          path: kaggle_debug_blobs.json

