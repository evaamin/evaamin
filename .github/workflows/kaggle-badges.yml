name: Update Kaggle badges

on:
  # No schedule: Kaggle serves a reCAPTCHA challenge page to unauthenticated
  # requests, including from GitHub-hosted runners, so a scheduled run would
  # just fail daily. Badge regeneration is done locally instead (with a real
  # logged-in session's cookie — see SETUP.md) and the resulting SVG pushed
  # here manually. Kept as workflow_dispatch in case that changes.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch badges and render SVG
        run: |
          python scripts/fetch_and_render.py \
            --username evanka1 \
            --out kaggle-badges.svg \
            --theme dark

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kaggle-badges.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update Kaggle badges"
            git push
          fi
