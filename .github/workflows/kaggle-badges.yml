name: Update Kaggle badges

on:
  # Manual trigger only for now. This authenticates with the KAGGLE_COOKIE
  # repo secret, but a valid cookie run from a GitHub-hosted runner's
  # datacenter IP still isn't guaranteed to dodge Kaggle's reCAPTCHA check
  # the way it does from a residential IP. Verify a manual run actually
  # finds badges before switching this back to a `schedule:` trigger —
  # otherwise it'll fail silently once a day instead of just once.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch badges and render SVG
        env:
          KAGGLE_COOKIE: ${{ secrets.KAGGLE_COOKIE }}
        run: |
          echo "$KAGGLE_COOKIE" > kaggle_cookie.txt
          python scripts/fetch_and_render.py \
            --username evanka1 \
            --out kaggle-badges.svg \
            --theme dark \
            --cookie-file kaggle_cookie.txt
          rm -f kaggle_cookie.txt

      - name: Commit changes if anything updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kaggle-badges.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update Kaggle badges"
            git push
          fi
